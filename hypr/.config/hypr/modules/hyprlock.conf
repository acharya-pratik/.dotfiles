# ================================
# Optimized Hyprlock Configuration for 14-inch 1080p Lenovo IdeaPad 3
# Time/date above password box (time: y=-120, date: y=-60, password: y=10)
# System default icon font for stats, low-power, Zsh-compatible
# ================================

general {
    disable_loading_bar = true
    grace = 10
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = ease, 0.4, 0.0, 0.2, 1
    animation = fade, 1, 6, ease
    animation = popin, 70%, 6, ease
}

# --- Background (ultra-light blur) ---
background {
    monitor = eDP-1
    path = ~/wallpapers/wallpaper.jpg  # Verify path
    blur_passes = 1
    blur_size = 6
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.1
    color = rgba(111111cc)
}

# --- Password Backdrop ---
shape {
    monitor = eDP-1
    size = 360, 60
    color = rgba(1a1a1a88)
    rounding = 16
    border_size = 3
    border_color = rgba(66ccffee) rgba(00cc99ee) 45deg
    shadow_passes = 1
    shadow_size = 8
    shadow_color = rgba(00000088)
    position = 0, 10
    halign = center
    valign = center
}

# --- Time (12-hour format) ---
label {
    text = cmd[update:60000] date '+%I:%M %p'  # e.g., 2:30 PM
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = rgba(ffffffee)
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000088)
    position = 0, -120
    halign = center
    valign = center
}

# --- Date ---
label {
    text = cmd[update:60000] date '+%A, %d %B %Y'  # e.g., Wednesday, 08 October 2025
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(ffffffcc)
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000088)
    position = 0, -60
    halign = center
    valign = center
}

# --- Left Column: System Stats (spaced ~35px vertically) ---
label {
    text = cmd[update:60000] cpu=$(awk '/^cpu /{print $2+$4,$2+$4+$5}' /proc/stat | tail -1 | awk '{print int($1*100/$2)}'); echo " ${cpu}%"
    font_size = 11
    font_family = $HYPRLOCK_FONT  # System default for icons
    color = rgba(88ccffbb)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = -450, -60
    halign = left
    valign = center
}

label {
    text = cmd[update:60000] mem=$(free | awk '/^Mem:/ {print int($3/$2*100)}'); echo " ${mem}%"
    font_size = 11
    font_family = $HYPRLOCK_FONT
    color = rgba(ffaa00bb)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = -450, -25
    halign = left
    valign = center
}

label {
    text = cmd[update:60000] disk=$(df -h / | awk 'NR==2 {print $5}'); echo " ${disk}"
    font_size = 11
    font_family = $HYPRLOCK_FONT
    color = rgba(00ccffbb)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = -450, 10
    halign = left
    valign = center
}

label {
    text = cmd[update:60000] if [[ -n $(ip link | grep 'state UP') ]]; then echo " Connected"; else echo "󰖪 Offline"; fi
    font_size = 11
    font_family = $HYPRLOCK_FONT
    color = rgba(66ff66bb)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = -450, 45
    halign = left
    valign = center
}

label {
    text = cmd[update:60000] temp=$(cat /sys/class/thermal/thermal_zone*/temp 2>/dev/null | head -n1); [[ -n "$temp" ]] && echo "🌡️ $((temp/1000))°C" || echo "🌡️ N/A"
    font_size = 11
    font_family = $HYPRLOCK_FONT
    color = rgba(ff6666bb)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = -450, 80
    halign = left
    valign = center
}

label {
    text = cmd[update:60000] ws=$(hyprctl activeworkspace -j | jq -r '.name' 2>/dev/null || echo "N/A"); echo " ${ws}"
    font_size = 11
    font_family = $HYPRLOCK_FONT
    color = rgba(ffffffaa)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = -450, 115
    halign = left
    valign = center
}

# --- Right Column: User Info (spaced ~35px vertically) ---
label {
    text = " $USER"
    font_size = 12
    font_family = $HYPRLOCK_FONT
    color = rgba(ffffffaa)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = 250, -60
    halign = left
    valign = center
}

label {
    text = cmd[update:60000] vol=$(amixer get Master | awk -F'[][]' '/dB/ {print $2}' | head -n1 2>/dev/null || echo "N/A"); echo " ${vol}"
    font_size = 11
    font_family = $HYPRLOCK_FONT
    color = rgba(88ccffbb)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = 250, -25
    halign = left
    valign = center
}

label {
    text = cmd[update:60000] if [[ -f /sys/class/power_supply/BAT0/capacity ]]; then echo " $(cat /sys/class/power_supply/BAT0/capacity)%"; else echo "⚡ AC"; fi
    font_size = 11
    font_family = $HYPRLOCK_FONT
    color = rgba(00ccffbb)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = 250, 10
    halign = left
    valign = center
}

label {
    text = cmd[update:60000] up=$(uptime -p | sed 's/up //;s/ hours/h/;s/ minutes/m/'); echo " ${up}"
    font_size = 11
    font_family = $HYPRLOCK_FONT
    color = rgba(ffffff88)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = 250, 45
    halign = left
    valign = center
}

label {
    text = $LAYOUT
    font_size = 11
    font_family = $HYPRLOCK_FONT
    color = rgba(ffaa88bb)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = 250, 80
    halign = left
    valign = center
}

label {
    text = cmd[update:0] if [[ $ATTEMPTS -gt 0 ]]; then echo "⚠ Failed: $ATTEMPTS"; fi
    font_size = 11
    font_family = $HYPRLOCK_FONT
    color = rgba(ff6666ee)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
    position = 250, 115
    halign = left
    valign = center
}

# --- Password Input ---
input-field {
    monitor = eDP-1
    size = 360, 60
    placeholder_text = <i>Enter Password...</i>
    dots_center = true
    dots_size = 0.25
    dots_spacing = 0.25
    inner_color = rgba(1a1a1a88)
    outer_color = rgba(66ccffee) rgba(00cc99ee) 45deg
    outline_thickness = 3
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    font_color = rgba(ffffffdd)
    check_color = rgba(00cc99ee)
    fail_color = rgba(ff6633ee)
    rounding = 16
    fade_on_empty = true
    fade_timeout = 800
    hide_input = false
    swap_font_color = true
    position = 0, 10
    halign = center
    valign = center
}
