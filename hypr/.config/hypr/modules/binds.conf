$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$clipboard = cliphist
# -----------------------------
# Core App Launchers
# -----------------------------
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit

#-----------------------------
# neovim
#----------------------------
bind = $mainMod, N, exec, kitty nvim

# -----------------------------
# Lock Screen
# -----------------------------
bind = $mainMod, L, exec, hyprlock -c ~/.config/hypr/modules/hyprlock.conf


#-----------------------------
# System Shutdown/Reboot
#-----------------------------
bind = $mainMod SHIFT, Q, exec, systemctl poweroff
bind = $mainMod SHIFT, R, exec, systemctl reboot

# -----------------------------
# Window Management
# -----------------------------
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod SHIFT, V, togglefloating
bind = $mainMod, F, fullscreen

# -----------------------------
# Clipboard Manager
# -----------------------------
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# -----------------------------
# Focus Movement (Vim-Style)
# -----------------------------
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# -----------------------------
# Screenshots (hyprshot Primary)
# -----------------------------
bind = , PRINT, exec, hyprshot -m window -o ~/Pictures
bind = SHIFT, PRINT, exec, hyprshot -m region -o ~/Pictures
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures

# -----------------------------
# Workspace Switching
# -----------------------------
# Workspace Cycling with Alt+Tab
bind = ALT, Tab, workspace, e+1
bind = ALT SHIFT, Tab, workspace, e-1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# -----------------------------
# Move Windows to Workspaces
# -----------------------------
bind = $mainMod SHIFT, 1, movetoworkspace, 1 silent
bind = $mainMod SHIFT, 2, movetoworkspace, 2 silent
bind = $mainMod SHIFT, 3, movetoworkspace, 3 silent
bind = $mainMod SHIFT, 4, movetoworkspace, 4 silent
bind = $mainMod SHIFT, 5, movetoworkspace, 5 silent
bind = $mainMod SHIFT, 6, movetoworkspace, 6 silent
bind = $mainMod SHIFT, 7, movetoworkspace, 7 silent
bind = $mainMod SHIFT, 8, movetoworkspace, 8 silent
bind = $mainMod SHIFT, 9, movetoworkspace, 9 silent
bind = $mainMod SHIFT, 0, movetoworkspace, 10 silent

# -----------------------------
# Scratchpad Workspace
# -----------------------------
bind = $mainMod, S, togglespecialworkspace, magic silent
bind = $mainMod SHIFT, S, movetoworkspace, special:magic silent

# -----------------------------
# Workspace Scrolling (Mouse)
# -----------------------------
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# -----------------------------
# Mouse Controls
# -----------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# -----------------------------
# Media Playback
# -----------------------------
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# -----------------------------
# Volume Controls
# -----------------------------
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 0.05+ && notify-send "Volume: $(wpctl get-volume @DEFAULT_AUDIO_SINK@)"
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05- && notify-send "Volume: $(wpctl get-volume @DEFAULT_AUDIO_SINK@)"
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send "Mute: $(wpctl get-volume @DEFAULT_AUDIO_SINK@)"
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && notify-send "Mic: $(wpctl get-volume @DEFAULT_AUDIO_SOURCE@)"

# -----------------------------
# Brightness Controls
# -----------------------------
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5% && notify-send "Brightness: $(brightnessctl | grep -o '[0-9]*%')"
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && notify-send "Brightness: $(brightnessctl | grep -o '[0-9]*%')"

# -----------------------------
# Power Profile Toggle
# -----------------------------
bindl = , XF86Launch1, exec, ~/.config/hypr/scripts/set_profile.sh
